server {
    listen 80;
    server_name _; # Acepta peticiones de cualquier IP o dominio

    location / {
        # Redirige el tráfico al contenedor llamado 'api' en su puerto 8000
        proxy_pass http://api:8000;

        # Reenvía los encabezados originales para que FastAPI sepa quién hace la petición
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}